# FFmpegKitNext AAR 构建（GitHub Actions 备选路径）
#
# 用途：不需要本机 Linux/macOS 环境，push 到 GitHub 后手动触发构建，
#       从 Artifact 下载 AAR 放入 ffmpeg-kit-prebuilt/ 即可。
#
# 用法：
#   1. 将此文件放入仓库 .github/workflows/ffmpegkit-build.yml 并 push
#   2. GitHub → Actions → "build-ffmpegkitnext" → Run workflow（可填版本号）
#   3. 构建完成后下载 Artifact：ffmpeg-kit-prebuilt（含 com/arthenica/.../xxx.aar）
#   4. 解压到仓库根，确认 gradle/dependencies.gradle 的 ffmpegKitNextVersion 一致
name: build-ffmpegkitnext

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FFmpegKitNext tag（需与 gradle 的 ffmpegKitNextVersion 一致）"
        required: true
        default: "9.0.1"
      gpl:
        description: "启用 GPL（x264/x265，整包变 GPL v3.0）"
        type: boolean
        default: false
      openssl:
        description: "启用 HTTPS（openssl）"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 组件（含 NDK r27d）
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-26" "ndk;27.2.12479018"

      - name: 克隆并构建 FFmpegKitNext
        shell: bash
        run: |
          set -euo pipefail
          # 全量 clone + 拉全部 tag：android.sh 依赖 `git describe --tags` 生成版本号，
          # 浅克隆会导致 describe 失败、构建直接退出
          git clone https://github.com/arthenica/ffmpeg-kit-next.git /tmp/ffmpeg-kit-next
          cd /tmp/ffmpeg-kit-next
          git fetch --tags --force origin
          git checkout -f "${{ github.event.inputs.version }}" 2>/dev/null \
            || git checkout -f "v${{ github.event.inputs.version }}" 2>/dev/null || true
          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          ARGS=(--api-level=26 --jobs=4 --force --disable-arm-v7a --disable-arm-v7a-neon --disable-x86)
          ${{ github.event.inputs.openssl == 'true' && 'ARGS+=(--enable-openssl)' || 'ARGS+=(--disable-openssl)' }}
          ${{ github.event.inputs.gpl == 'true' && 'ARGS+=(--enable-gpl --enable-x264 --enable-x265)' || '' }}
          ./android.sh "${ARGS[@]}"

      - name: 上传 AAR 产物
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-prebuilt
          path: /tmp/ffmpeg-kit-next/prebuilt/**
          if-no-files-found: error
